name: "Этап 4 — ЧИСТЫЙ исходник (github/mobile) + RU-перевод + сборка APK v3"

on:
  workflow_dispatch:
  # push-триггер отключён: ручной запуск только
  push:
    branches:
      - "arena/01a10bda-lwlwxldodiwjnwmwllxllxmxmxks-disabled"
    paths:
      - ".github/workflows/04-build-clean.yml"
      - "tools/clean_adapt.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-clean:
    name: "github/mobile -> rudroid + RU + assembleRelease"
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: "Checkout нашего репозитория (ключ, перевод, скрипты)"
        uses: actions/checkout@v4
        with:
          ref: "arena/01a10bda-lwlwxldodiwjnwmwllxllxmxmxks"
          persist-credentials: true

      - name: "JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "Android SDK"
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "platform-tools" | tail -2

      - name: "Клонирование чистого исходника github/mobile"
        run: git clone --depth 1 https://github.com/github/mobile.git /tmp/mobile

      - name: "Рекон: модули, applicationId, google-services"
        run: |
          ls /tmp/mobile > /tmp/recon.txt 2>&1
          {
            echo "=== settings.gradle ==="; head -60 /tmp/mobile/settings.gradle* 2>/dev/null
            echo "=== корневой build.gradle ==="; head -40 /tmp/mobile/build.gradle* 2>/dev/null
            echo "=== build.gradle модулей ==="; find /tmp/mobile -name "build.gradle*" -not -path "*/.git/*" | head -30
            echo "=== applicationId / namespace ==="; grep -rn "applicationId\|namespace " /tmp/mobile --include="build.gradle*" | head -20
            echo "=== google-services/firebase/crashlytics ==="; grep -rln "google.services\|crashlytics\|firebase" /tmp/mobile --include="build.gradle*" | head -10
            echo "=== wrapper ==="; cat /tmp/mobile/gradle/wrapper/gradle-wrapper.properties 2>/dev/null
            echo "=== strings.xml ==="; find /tmp/mobile -name "strings.xml" -path "*res*" -not -path "*/.git/*" | head -10
            echo "=== манифесты ==="; find /tmp/mobile -name "AndroidManifest.xml" -not -path "*/.git/*" | head -10
            echo "=== gradle.properties ==="; head -20 /tmp/mobile/gradle.properties 2>/dev/null
            echo "=== размер без .git ==="; du -sh --exclude=.git /tmp/mobile
            echo "=== deep link OAuth ==="; grep -rln "github://com.github.android" /tmp/mobile --include="*.xml" --include="*.kt" | head -5
          } >> /tmp/recon.txt 2>&1
          cat /tmp/recon.txt

      - name: "Извлечение RU-перевода из архива v1"
        run: |
          set -e
          sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
          mkdir -p /tmp/stage1 /tmp/ext
          7z x -y -o/tmp/stage1 "GitHub-RU-Source legal.zip.zip" >/dev/null
          unzip -q -o /tmp/stage1/*.zip -d /tmp/ext/ || true
          find /tmp/ext -path "*values-ru/strings.xml" | head -1 > /tmp/ru-path.txt
          cat /tmp/ru-path.txt
          wc -l "$(cat /tmp/ru-path.txt)"

      - name: "Адаптация: rudroid + v930 + подпись + RU + Firebase-флаги"
        run: |
          set -e
          RU=$(cat /tmp/ru-path.txt)
          python3 tools/clean_adapt.py /tmp/mobile "$RU" handoff/GitHub-RU-v2/app/github-ru.jks

      - name: "Сборка: ./gradlew assembleRelease"
        run: |
          set -e
          set -o pipefail
          cd /tmp/mobile
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/clean-build.log | tail -50

      - name: "Результаты: APK v3 + логи"
        if: always()
        run: |
          set -e
          cd /tmp/mobile
          APK=$(find . -name "*release*.apk" | head -1) || true
          mkdir -p "$GITHUB_WORKSPACE/handoff"
          if [ -n "$APK" ]; then
            cp -f "$APK" "$GITHUB_WORKSPACE/handoff/GitHub-RU-Clean-v3-930-release.apk"
            sha256sum "$GITHUB_WORKSPACE/handoff/GitHub-RU-Clean-v3-930-release.apk" > "$GITHUB_WORKSPACE/handoff/APK-Clean-v3-SHA256.txt"
            cat "$GITHUB_WORKSPACE/handoff/APK-Clean-v3-SHA256.txt"
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -6 || true
          else
            echo "APK не собран — смотреть clean-build-log.txt"
          fi
          cp -f /tmp/clean-build.log "$GITHUB_WORKSPACE/handoff/clean-build-log.txt" 2>/dev/null || true
          cp -f /tmp/recon.txt "$GITHUB_WORKSPACE/handoff/clean-recon.txt" 2>/dev/null || true

      - name: "Чистый исходник -> handoff/GitHub-RU-Clean (Android-часть)"
        if: always()
        run: |
          set -e
          mkdir -p handoff/GitHub-RU-Clean
          rsync -a --exclude '.git' --exclude 'build' --exclude '.gradle' --exclude '.idea' --exclude '.kotlin' /tmp/mobile/ handoff/GitHub-RU-Clean/
          du -sh handoff/GitHub-RU-Clean || true
          find handoff/GitHub-RU-Clean -type f | wc -l || true

      - name: "Артефакт: APK v3"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GitHub-RU-Clean-v3-apk
          path: handoff/GitHub-RU-Clean-v3-930-release.apk
          retention-days: 90
          if-no-files-found: warn

      - name: "Коммит результатов в ветку"
        if: always()
        run: |
          set -e
          git config user.name "kami-bot"
          git config user.email "kami-bot@users.noreply.github.com"
          git add handoff/ || true
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Этап 4: чистый github/mobile + RU -> APK v3 [skip ci]"
            git push origin "HEAD:arena/01a10bda-lwlwxldodiwjnwmwllxllxmxmxks"
          fi
