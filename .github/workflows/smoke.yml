name: MailGram — живой прогон

# Отдельная задача: поднять эмулятор, поставить приложение и открыть экраны так,
# как это делает человек. Если что-то падает — точная причина попадает в аннотации.
# Сборку и публикацию APK эта задача не трогает.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailgram-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Живой прогон
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_PATH"

      - name: Кэш NDK, CMake и платформы
        id: sdk
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-37
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-37-ndk-28.2.13676358-cmake-3.22.1-v1

      - name: Установка недостающего (только первый раз)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" | tail -3

      - name: Сборка отладочного APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log

      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|What went wrong|Caused by|AAPT|aapt2|Execution failed" build.log \
              | tail -40 | while IFS= read -r line; do
                echo "::error title=Ошибка сборки::$line"
              done
          fi
          exit 0

      - name: Живой прогон на эмуляторе
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/smoke-emulator.sh

      - name: Полный след ошибок
        if: always()
        run: |
          adb logcat -d -b crash 2>/dev/null | tail -200 || true
