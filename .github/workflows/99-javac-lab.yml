name: "99: javac-лаборатория (репро Object-слепоты)"

on:
  push:
    paths:
      - ".github/workflows/99-javac-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "arena/01a10bda-lwlwxldodiwjnwmwllxllxmxmxks"
      - name: "JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: "android.jar"
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" | tail -1
          echo "AJ=$SDK/platforms/android-36/android.jar" >> "$GITHUB_ENV"
      - name: "Эксперименты"
        shell: bash
        run: |
          R=lab-report.txt; : > "$R"
          SRC="$PWD/handoff/GitHub-RU-v2/app/src/main/java"
          AJ="$AJ"
          [ -n "$AJ" ] || AJ=$(echo "$ANDROID_HOME")/platforms/android-36/android.jar

          echo "===== ЭКСП 1: v1.java один (bootclasspath, без sourcepath) =====" | tee -a "$R"
          rm -rf /tmp/l1; mkdir -p /tmp/l1
          javac -d /tmp/l1 -nowarn -proc:none -Xmaxerrs 50 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC/a0/v1.java" 2>&1 | head -15 | tee -a "$R" || true

          echo "===== ЭКСП 2: v1.java + u1.java =====" | tee -a "$R"
          rm -rf /tmp/l2; mkdir -p /tmp/l2
          javac -d /tmp/l2 -nowarn -proc:none -Xmaxerrs 50 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC/a0/v1.java" "$SRC/a0/u1.java" 2>&1 | head -15 | tee -a "$R" || true

          echo "===== ЭКСП 3: v1 + u1 + k71-стаб =====" | tee -a "$R"
          rm -rf /tmp/l3; mkdir -p /tmp/l3
          printf '%s\n' 'package k71;' 'public class k {' '    public static boolean b(Object a, Object b) { return a == b || (a != null && a.equals(b)); }' '    public static int b(Object a) { return a == null ? 0 : a.hashCode(); }' '}' > /tmp/l3src_k.java
          javac -d /tmp/l3 -nowarn -proc:none -Xmaxerrs 50 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC/a0/v1.java" "$SRC/a0/u1.java" /tmp/l3src_k.java 2>&1 | head -15 | tee -a "$R" || true

          echo "===== ЭКСП 4: весь пакет a0 (44 файла) =====" | tee -a "$R"
          rm -rf /tmp/l4; mkdir -p /tmp/l4
          javac -d /tmp/l4 -nowarn -proc:none -Xmaxerrs 50 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC"/a0/*.java 2>&1 | head -25 | tee -a "$R" || true
          echo "--- счётчик Object-ошибок в exp4:"
          javac -d /tmp/l4b -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC"/a0/*.java 2>&1 | grep -c "symbol:   class Object$" | tee -a "$R" || true

          echo "===== ЭКСП 5: весь пакет i80 =====" | tee -a "$R"
          rm -rf /tmp/l5; mkdir -p /tmp/l5
          javac -d /tmp/l5 -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC"/i80/*.java 2>&1 | grep -cE "error:" | tee -a "$R" || true
          javac -d /tmp/l5b -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" "$SRC"/i80/*.java 2>&1 | grep -c "symbol:   class Object$" | tee -a "$R" || true

          echo "===== ЭКСП 6: FULL, -Xmx3g =====" | tee -a "$R"
          grep -v "^$" /tmp/sources.txt > /tmp/sources_all.txt || find "$SRC" -name "*.java" | sort > /tmp/sources_all.txt
          find "$SRC" -name "*.java" | sort > /tmp/sources_all.txt
          echo "файлов: $(wc -l < /tmp/sources_all.txt)" | tee -a "$R"
          javac -J-Xmx3g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l6 @/tmp/sources_all.txt > /tmp/l6.log 2>&1 || true
          echo "exit=$? errors=$(grep -c 'error:' /tmp/l6.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l6.log)" | tee -a "$R"
          echo "===== ЭКСП 7: FULL, -Xmx10g =====" | tee -a "$R"
          javac -J-Xmx10g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l7 @/tmp/sources_all.txt > /tmp/l7.log 2>&1 || true
          echo "exit=$? errors=$(grep -c 'error:' /tmp/l7.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l7.log)" | tee -a "$R"
          echo "===== ЭКСП 8: половина 1 =====" | tee -a "$R"
          head -n $(( $(wc -l < /tmp/sources_all.txt) / 2 )) /tmp/sources_all.txt > /tmp/s_half1.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l8 @/tmp/s_half1.txt > /tmp/l8.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l8.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l8.log)" | tee -a "$R"
          echo "===== ЭКСП 9: половина 2 =====" | tee -a "$R"
          tail -n +$(( $(wc -l < /tmp/sources_all.txt) / 2 + 1 )) /tmp/sources_all.txt > /tmp/s_half2.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l9 @/tmp/s_half2.txt > /tmp/l9.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l9.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l9.log)" | tee -a "$R"
          echo "===== ЭКСП 10: 3000 файлов случайных =====" | tee -a "$R"
          shuf -n 3000 /tmp/sources_all.txt > /tmp/s_rand.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l10 @/tmp/s_rand.txt > /tmp/l10.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l10.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l10.log)" | tee -a "$R"
          echo "===== ЭКСП 10b: топ Object-шума ЭКСП 7 (пакеты) =====" | tee -a "$R"
          grep -B4 "symbol:   class Object$" /tmp/l7.log | grep -oE "java/[a-zA-Z0-9_/]+\.java" | cut -d/ -f1 | sort | uniq -c | sort -rn | head -5 | tee -a "$R"

          echo "===== ЭКСП 11: k71/*.java изолированно =====" | tee -a "$R"
          javac -J-Xmx2g -nowarn -proc:none -Xmaxerrs 30 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l11 "$SRC"/k71/*.java 2>&1 | head -20 | tee -a "$R" || true
          echo "k71_errors=$(javac -J-Xmx2g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l11b "$SRC"/k71/*.java 2>&1 | grep -c 'error:')" | tee -a "$R"
          echo "===== ЭКСП 12: v1 + u1 + k71/*.java (настоящий) =====" | tee -a "$R"
          javac -J-Xmx2g -nowarn -proc:none -Xmaxerrs 50 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l12 "$SRC/a0/v1.java" "$SRC/a0/u1.java" "$SRC"/k71/*.java > /tmp/l12.log 2>&1 || true
          grep -c "error:" /tmp/l12.log | tee -a "$R"; grep "symbol:" /tmp/l12.log | sort | uniq -c | head -5 | tee -a "$R"
          echo "===== ЭКСП 13: v1 + u1 + k71 + зависимости k71 =====" | tee -a "$R"
          ls "$SRC"/k71/ | head -5 | tee -a "$R"
          head -3 "$SRC/k71/k.java" | tee -a "$R"

          echo "===== ЭКСП 14: FULL БЕЗ стаб-файлов =====" | tee -a "$R"
          grep -v -Z -e "" /dev/null 2>/dev/null || true
          while IFS= read -r f; do if ! grep -q "СТАБ-\|\[restore\]" "$f" 2>/dev/null; then echo "$f"; fi; done < /tmp/sources_all.txt > /tmp/s_nostubs.txt
          echo "файлов без стабов: $(wc -l < /tmp/s_nostubs.txt) (вырезано: $(( $(wc -l < /tmp/sources_all.txt) - $(wc -l < /tmp/s_nostubs.txt) )))" | tee -a "$R"
          javac -J-Xmx10g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l14 @/tmp/s_nostubs.txt > /tmp/l14.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l14.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l14.log)" | tee -a "$R"
          echo "===== ЭКСП 15: half2 верхняя половина (11k) =====" | tee -a "$R"
          H2=$(( $(wc -l < /tmp/sources_all.txt) / 2 ))
          TOT=$(wc -l < /tmp/sources_all.txt)
          sed -n "$((H2+1)),$(( (H2+TOT)/2 ))p" /tmp/sources_all.txt > /tmp/s_h2a.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l15 @/tmp/s_h2a.txt > /tmp/l15.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l15.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l15.log)" | tee -a "$R"
          echo "===== ЭКСП 16: half2 нижняя половина (11k) =====" | tee -a "$R"
          sed -n "$(( (H2+TOT)/2 + 1 )),${TOT}p" /tmp/sources_all.txt > /tmp/s_h2b.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l16 @/tmp/s_h2b.txt > /tmp/l16.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l16.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l16.log)" | tee -a "$R"

          echo "===== ЭКСП 17: FULL СО ВСЕМИ стабами, БЕЗ <T1,T2,T3,T4> у стабов =====" | tee -a "$R"
          python3 tools/lab_no_generics.py "$SRC" /tmp/s_var /tmp/sources_all.txt /tmp/s_var.txt | tee -a "$R"
          echo "errors=$(grep -c 'error:' /tmp/l17.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l17.log)" | tee -a "$R"

          echo "===== ЭКСП 20: 10k файлов =====" | tee -a "$R"
          head -n 10000 /tmp/sources_all.txt > /tmp/s10k.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l20 @/tmp/s10k.txt > /tmp/l20.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l20.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l20.log)" | tee -a "$R"
          echo "===== ЭКСП 21: 20k файлов =====" | tee -a "$R"
          head -n 20000 /tmp/sources_all.txt > /tmp/s20k.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l21 @/tmp/s20k.txt > /tmp/l21.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l21.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l21.log)" | tee -a "$R"
          echo "===== ЭКСП 22: 30k файлов =====" | tee -a "$R"
          head -n 30000 /tmp/sources_all.txt > /tmp/s30k.txt
          javac -J-Xmx6g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/l22 @/tmp/s30k.txt > /tmp/l22.log 2>&1 || true
          echo "errors=$(grep -c 'error:' /tmp/l22.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l22.log)" | tee -a "$R"
          echo "===== ЭКСП 23: ДВУХЧАСТНАЯ full =====" | tee -a "$R"
          TOT=$(wc -l < /tmp/sources_all.txt); H=$(( TOT / 2 ))
          head -n $H /tmp/sources_all.txt > /tmp/s_p1.txt
          tail -n +$((H+1)) /tmp/sources_all.txt > /tmp/s_p2.txt
          rm -rf /tmp/cp1; javac -J-Xmx8g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -d /tmp/cp1 @/tmp/s_p1.txt > /tmp/l23a.log 2>&1 || true
          echo "part1: errors=$(grep -c 'error:' /tmp/l23a.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l23a.log)" | tee -a "$R"
          javac -J-Xmx8g -nowarn -proc:none -Xmaxerrs 200000 -source 8 -target 8 -encoding UTF-8 -bootclasspath "$AJ" -classpath /tmp/cp1 -d /tmp/cp2 @/tmp/s_p2.txt > /tmp/l23b.log 2>&1 || true
          echo "part2: errors=$(grep -c 'error:' /tmp/l23b.log) Object=$(grep -c 'symbol:   class Object$' /tmp/l23b.log)" | tee -a "$R"





      - name: "Коммит отчёта лабы"
        if: always()
        run: |
          git config user.name "kami-bot"
          git config user.email "kami-bot@users.noreply.github.com"
          mkdir -p handoff/restoration
          cp lab-report.txt handoff/restoration/lab-report.txt
          git add handoff/restoration/lab-report.txt
          git commit -m "javac-lab отчёт [skip ci]" || true
          git push origin "HEAD:arena/01a10bda-lwlwxldodiwjnwmwllxllxmxmxks" || true
