name: VK APK static review

on:
  push:
    branches:
      - arena/3f6a741b-lwlwxldodiwjnwmwllxllxmxmxks
    paths:
      - .github/workflows/vk-apk-static-review.yml
      - .gitattributes
      - handoff/analyze_decompiled.py
      - handoff/analyze_package_size.py
      - handoff/analyze_xapk_layout.py
      - handoff/optimize_abi_apk.py
      - handoff/prepare_apkpure_xapk.py
      - handoff/README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-and-review:
    name: Download, verify, and inspect APKPure VK latest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APK_ARCHIVE_NAME: vk-latest.xapk
      APK_NAME: vk-base.apk
      MOD_APK_NAME: vk-mod-arm.apk
      JADX_DIRECTORY: vk-jadx
      APKPURE_XAPK_URL: 'https://d.apkpure.net/b/XAPK/com.vkontakte.android?version=latest'
      EXPECTED_SIGNER_SHA1: 48761eef50ee53afc4cc9c5f10e6bde7f8f5b82f
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Java for JADX
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download latest VK XAPK from APKPure
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/$APK_ARCHIVE_NAME"
          set +e
          response="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --max-time 1800 \
            --user-agent 'Mozilla/5.0 (compatible; GitHubActions APK static review)' \
            --referer 'https://apkpure.net/' \
            --header 'Accept: application/vnd.android.package-archive, application/octet-stream, */*' \
            --write-out '%{http_code}|%{content_type}' \
            --output "$ARCHIVE_PATH" "$APKPURE_XAPK_URL" 2>"$RUNNER_TEMP/curl-error.txt")"
          curl_status=$?
          set -e
          if (( curl_status != 0 )); then
            echo "::error::APKPure download request failed with curl exit $curl_status"
            exit 1
          fi
          http_status="${response%%|*}"
          content_type="${response#*|}"
          size_bytes="$(stat -c '%s' "$ARCHIVE_PATH")"
          echo "APKPure response: HTTP $http_status, content-type=$content_type, bytes=$size_bytes"
          if [[ "$http_status" != '200' ]]; then
            echo "::error::APKPure returned HTTP $http_status"
            exit 1
          fi
          if (( size_bytes < 50000000 || size_bytes > 1000000000 )); then
            echo "::error::Unexpected download size: $size_bytes bytes"
            exit 1
          fi
          python3 - "$ARCHIVE_PATH" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          if not zipfile.is_zipfile(path):
              raise SystemExit('APKPure response is not an APK/XAPK ZIP archive')
          with zipfile.ZipFile(path) as archive:
              print(f'ZIP archive entries: {len(archive.namelist())}')
          PY
          sha256sum "$ARCHIVE_PATH"

      - name: Prepare base APK from APKPure response
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/prepare_apkpure_xapk.py \
            "$RUNNER_TEMP/$APK_ARCHIVE_NAME" \
            "$RUNNER_TEMP/$APK_NAME"
          sha256sum "$RUNNER_TEMP/$APK_NAME"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$RUNNER_TEMP/$APK_NAME"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo 'Android build-tools are unavailable on this runner; refusing to skip signature verification.' >&2
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo 'apksigner was not found in Android build-tools.' >&2
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/apk-signature.txt" 2>&1
          signer_digests="$(python3 - "$RUNNER_TEMP/apk-signature.txt" <<'PY'
          import re
          import sys
          values = {'1': set(), '256': set()}
          pattern = re.compile(
              r'(?i)^\s*(?:Signer\s+#\d+\s+certificate|'
              r'V\d+(?:\.\d+)?\s+Signer:\s+certificate)\s+'
              r'SHA-(1|256)\s+digest:\s*([0-9a-f:]+)'
          )
          with open(sys.argv[1], encoding='utf-8', errors='replace') as stream:
              for line in stream:
                  match = pattern.search(line)
                  if match:
                      values[match.group(1)].add(match.group(2).lower().replace(':', ''))
          sha1 = next(iter(values['1'])) if len(values['1']) == 1 else ''
          sha256 = next(iter(values['256'])) if len(values['256']) == 1 else ''
          print(f"{sha1}|{sha256}|{len(values['1'])}|{len(values['256'])}")
          PY
          )"
          IFS='|' read -r actual_sha1 actual_sha256 sha1_count sha256_count <<< "$signer_digests"
          echo "Verified APK signer SHA-1: ${actual_sha1:-unavailable}"
          echo "::notice title=APK signer digests::SHA-1=${actual_sha1:-unavailable}; SHA-256=${actual_sha256:-unavailable}"
          if [[ "$sha1_count" != '1' || "$sha256_count" != '1' ]]; then
            echo "::error::Expected one distinct APK signer certificate; found $sha1_count SHA-1 and $sha256_count SHA-256 fingerprints."
            exit 1
          fi
          if [[ "$actual_sha1" != "$EXPECTED_SIGNER_SHA1" ]]; then
            echo "::error::Signer mismatch; expected the previously observed VK signer SHA-1 $EXPECTED_SIGNER_SHA1, received ${actual_sha1:-none}."
            exit 1
          fi

      - name: Preserve APKPure source files in handoff through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          expected_ref='refs/heads/arena/3f6a741b-lwlwxldodiwjnwmwllxllxmxmxks'
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Refusing to persist APK outside the session branch $expected_ref"
            exit 1
          fi
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          mkdir -p handoff
          cp "$RUNNER_TEMP/$APK_ARCHIVE_NAME" handoff/vk-apkpure-latest.xapk
          cp "$RUNNER_TEMP/$APK_NAME" handoff/vk-apkpure-latest-base.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes handoff/vk-apkpure-latest.xapk handoff/vk-apkpure-latest-base.apk
          if git diff --cached --quiet; then
            echo 'APKPure source files are already current in handoff.'
          else
            git commit -m 'Store APKPure VK source files in handoff [skip ci]'
            git push origin "HEAD:$expected_ref"
          fi
          echo 'Original XAPK and extracted base APK are retained in handoff via Git LFS.'

      - name: Audit APK/XAPK size composition
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/analyze_package_size.py \
            "$RUNNER_TEMP/$APK_ARCHIVE_NAME" \
            "$RUNNER_TEMP/$APK_NAME"

      - name: Inspect XAPK split layout
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/analyze_xapk_layout.py "$RUNNER_TEMP/$APK_ARCHIVE_NAME"

      - name: Build ARM-focused size-optimized APK
        id: build_mod
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error title=ARM APK build::Command failed at shell line $LINENO (exit $status)"; exit "$status"' ERR
          raw_apk="$RUNNER_TEMP/vk-mod-arm-unaligned.apk"
          aligned_apk="$RUNNER_TEMP/vk-mod-arm-aligned.apk"
          signed_apk="$RUNNER_TEMP/$MOD_APK_NAME"
          keystore="$RUNNER_TEMP/vk-mod-temporary.p12"
          password_file="$RUNNER_TEMP/vk-mod-temporary.pass"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo 'Android build-tools are unavailable; refusing to produce an unsigned or unverified mod.' >&2
            exit 1
          fi
          zipalign="$(find "$sdk_root/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$zipalign" || -z "$apksigner" ]]; then
            echo 'zipalign or apksigner was not found in Android build-tools.' >&2
            exit 1
          fi

          python3 handoff/optimize_abi_apk.py \
            "$RUNNER_TEMP/$APK_NAME" "$raw_apk" \
            --keep-abi arm64-v8a --keep-abi armeabi-v7a
          "$zipalign" -P 16 -f 4 "$raw_apk" "$aligned_apk"
          "$zipalign" -c -P 16 -v 4 "$aligned_apk"

          python3 - "$password_file" <<'PY'
          import secrets
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          path.write_text(secrets.token_urlsafe(32), encoding='ascii')
          path.chmod(0o600)
          PY
          keytool -genkeypair -noprompt \
            -alias vk-mod-temporary \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA \
            -validity 10000 -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass:file "$password_file" \
            -keypass:file "$password_file" \
            -dname 'CN=VK ARM size mod, O=Temporary build, C=DE'
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias vk-mod-temporary \
            --ks-pass "file:$password_file" \
            --key-pass "file:$password_file" \
            --out "$signed_apk" "$aligned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"

          original_bytes="$(stat -c '%s' "$RUNNER_TEMP/$APK_NAME")"
          mod_bytes="$(stat -c '%s' "$signed_apk")"
          if (( mod_bytes >= original_bytes )); then
            echo "::error::Signed ARM APK is not smaller than its source ($mod_bytes >= $original_bytes bytes)."
            exit 1
          fi
          reduction=$((original_bytes - mod_bytes))
          awk -v before="$original_bytes" -v after="$mod_bytes" \
            'BEGIN { printf "Signed APK size: %d -> %d bytes; reduction: %d bytes (%.2f%%)\n", before, after, before-after, (before-after)*100/before }'

      - name: Preserve optimized ARM APK in handoff through Git LFS
        if: steps.build_mod.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          expected_ref='refs/heads/arena/3f6a741b-lwlwxldodiwjnwmwllxllxmxmxks'
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Refusing to persist the optimized APK outside the session branch $expected_ref"
            exit 1
          fi
          if ! command -v git-lfs >/dev/null 2>&1; then
            echo 'Git LFS is unavailable; refusing to store the mod as a normal Git blob.' >&2
            exit 1
          fi
          git lfs install --local
          cp "$RUNNER_TEMP/$MOD_APK_NAME" "handoff/$MOD_APK_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes "handoff/$MOD_APK_NAME"
          if git diff --cached --quiet; then
            echo 'The optimized ARM APK is already current in handoff.'
          else
            git commit -m 'Store size-optimized VK ARM APK in handoff [skip ci]'
            git push origin "HEAD:$expected_ref"
          fi
          pointer_line="$(git show "HEAD:handoff/$MOD_APK_NAME" | sed -n '1p')"
          if [[ "$pointer_line" != 'version https://git-lfs.github.com/spec/v1' ]]; then
            echo '::error::Optimized APK was not committed as a Git LFS pointer.'
            exit 1
          fi
          echo 'The signed ARM APK is retained in handoff through Git LFS.'

      - name: Audit optimized APK size composition
        if: steps.build_mod.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/analyze_package_size.py "$RUNNER_TEMP/$MOD_APK_NAME"

      - name: Download JADX
        if: success() && steps.build_mod.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip' \
            --output "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          test -x "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --version

      - name: Decompile to temporary runner storage
        if: success() && steps.build_mod.outcome == 'success'
        shell: bash
        env:
          JAVA_OPTS: -Xmx10g
        run: |
          set -euo pipefail
          APK_PATH="$RUNNER_TEMP/$APK_NAME"
          JADX_OUT="$RUNNER_TEMP/$JADX_DIRECTORY"
          mkdir -p "$JADX_OUT"
          if ! "$RUNNER_TEMP/jadx/bin/jadx" \
            --threads-count 2 \
            --output-dir "$JADX_OUT" \
            "$APK_PATH" > "$RUNNER_TEMP/jadx.log" 2>&1; then
            if ! python3 - "$RUNNER_TEMP/jadx.log" "$JADX_OUT" <<'PY'
          import re
          import sys
          from pathlib import Path
          log_path, output_path = map(Path, sys.argv[1:])
          text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.is_file() else ''
          error_count = len(re.findall(r'\bERROR\b', text, re.IGNORECASE))
          exception_types = sorted(set(re.findall(r'\b([A-Za-z_$][\w$]*(?:Exception|Error))\b', text)))
          memory_hint = bool(re.search(r'OutOfMemoryError|Java heap space|GC overhead', text, re.IGNORECASE))
          java_count = sum(1 for _ in output_path.rglob('*.java')) if output_path.exists() else 0
          manifest_found = any(p.name == 'AndroidManifest.xml' for p in output_path.rglob('*')) if output_path.exists() else False
          usable_partial = java_count >= 10000 and manifest_found
          message = (
              f'JADX incomplete; error markers={error_count}; '
              f'exception types={",".join(exception_types[:8]) or "none"}; '
              f'heap-error-marker={"yes" if memory_hint else "no"}; '
              f'Java files={java_count}; manifest-emitted={manifest_found}; '
              f'partial scan accepted={usable_partial}'
          )
          message = message.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          level = 'warning' if usable_partial else 'error'
          print(f'::{level} title=JADX decompilation::{message}')
          raise SystemExit(0 if usable_partial else 1)
          PY
            then
              exit 1
            fi
            echo 'JADX_INCOMPLETE=true' >> "$GITHUB_ENV"
          else
            echo 'JADX_INCOMPLETE=false' >> "$GITHUB_ENV"
            echo 'JADX completed; source remains only in the ephemeral runner.'
          fi
          find "$JADX_OUT" -type f -name '*.java' | wc -l | awk '{print "Decompiled Java files: " $1}'

      - name: Generate metadata-only handoff summary
        if: success() && steps.build_mod.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$RUNNER_TEMP/$APK_NAME"
          JADX_OUT="$RUNNER_TEMP/$JADX_DIRECTORY"
          if [[ "${JADX_INCOMPLETE:-false}" == 'true' ]]; then
            echo '> **Partial decompilation:** JADX hit an error after emitting a substantial tree; the findings below cover emitted files only.' >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 handoff/analyze_decompiled.py "$JADX_OUT" "$APK_PATH"

      - name: Fail job if the mod build failed
        if: always() && steps.build_mod.outcome == 'failure'
        shell: bash
        run: |
          echo '::error title=VK ARM mod::No optimized APK was created; see the APK size optimization annotation above.'
          exit 1

      - name: Remove temporary APK and decompiled tree
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/$APK_ARCHIVE_NAME" "$RUNNER_TEMP/$APK_NAME" \
            "$RUNNER_TEMP/$MOD_APK_NAME" "$RUNNER_TEMP/vk-mod-arm-unaligned.apk" \
            "$RUNNER_TEMP/vk-mod-arm-aligned.apk" "$RUNNER_TEMP/vk-mod-temporary.p12" \
            "$RUNNER_TEMP/vk-mod-temporary.pass" "$RUNNER_TEMP/$JADX_DIRECTORY" \
            "$RUNNER_TEMP/jadx" "$RUNNER_TEMP/jadx.zip" "$RUNNER_TEMP/jadx.log" \
            "$RUNNER_TEMP/apk-signature.txt" "$RUNNER_TEMP/curl-error.txt"
