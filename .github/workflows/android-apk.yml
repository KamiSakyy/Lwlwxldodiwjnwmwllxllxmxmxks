name: Android ARM64 signed release (API 36)

on:
  push:
    branches:
      - arena/ade03820-lwlwxldodiwjnwmwllxllxmxmxks
    paths-ignore:
      - HANDOFF/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nox-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/arena/ade03820-lwlwxldodiwjnwmwllxllxmxmxks'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4
        with:
          ref: arena/ade03820-lwlwxldodiwjnwmwllxllxmxmxks
          fetch-depth: 0

      - name: Set up Java 21 (libsignal toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Install API 36 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate permanent release signer in HANDOFF
        run: |
          set -euo pipefail
          test -s HANDOFF/nox-release-key.p12
          test -s HANDOFF/nox-release-key-password.txt
          test -s HANDOFF/nox-release-certificate.pem
          openssl pkcs12 -in HANDOFF/nox-release-key.p12 -noout -info \
            -passin file:HANDOFF/nox-release-key-password.txt >/dev/null 2>&1
          latest_patch=0
          for apk in HANDOFF/Nox-P2P-ARM64-API36-v1.0.*-release.apk; do
            [[ -f "$apk" ]] || continue
            patch="${apk##*-v1.0.}"
            patch="${patch%-release.apk}"
            [[ "$patch" =~ ^[0-9]+$ ]] || continue
            (( patch > latest_patch )) && latest_patch="$patch"
          done
          next_patch=$((latest_patch + 1))
          echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/HANDOFF/nox-release-key.p12" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=nox-release" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$next_patch" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.0.$next_patch" >> "$GITHUB_ENV"

      - name: Build signed, minified release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleRelease \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Report Gradle failure details
        if: failure()
        run: |
          if test -s "$RUNNER_TEMP/gradle-build.log"; then
            python3 - "$RUNNER_TEMP/gradle-build.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          excerpt = "\\n".join(lines[-50:])
          excerpt = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle build diagnostics::{excerpt}")
          PY
          fi

      - name: Verify signer and ARM64-only APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          actual_fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$RUNNER_TEMP/apk-signature.txt" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(openssl x509 -in HANDOFF/nox-release-certificate.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" {print $2}' | sort -u)"
          echo "APK native ABIs: ${abis}"
          test "$abis" = "arm64-v8a"

      - name: Prepare versioned HANDOFF files
        run: |
          set -euo pipefail
          version="$APP_VERSION_NAME"
          apk_name="Nox-P2P-ARM64-API36-v${version}-release.apk"
          source_name="Nox-P2P-Android-sources-v${version}.zip"
          mkdir -p HANDOFF
          test ! -e "HANDOFF/$apk_name" || { echo "Version already published: $apk_name"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "HANDOFF/$apk_name"
          zip -r "HANDOFF/$source_name" \
            app/src app/build.gradle app/proguard-rules.pro \
            settings.gradle build.gradle gradle.properties .gitignore \
            database.rules.json README.md .github/workflows/android-apk.yml \
            HANDOFF/README.md HANDOFF/RELEASE-SIGNING.md \
            HANDOFF/nox-release-certificate.pem HANDOFF/nox-release-fingerprint.txt \
            HANDOFF/nox-release-key.p12 HANDOFF/nox-release-key-password.txt \
            -x 'app/build/*' '*/.DS_Store'
          source_bytes="$(stat -c %s "HANDOFF/$source_name")"
          echo "Source archive size: ${source_bytes} bytes"
          test "$source_bytes" -lt 1048576
          echo "Release APK: HANDOFF/$apk_name"
          echo "Source archive: HANDOFF/$source_name"

      - name: Upload signed release and source archive
        uses: actions/upload-artifact@v4
        with:
          name: Nox-P2P-ARM64-API36-v${{ env.APP_VERSION_NAME }}-release
          path: |
            HANDOFF/Nox-P2P-ARM64-API36-v${{ env.APP_VERSION_NAME }}-release.apk
            HANDOFF/Nox-P2P-Android-sources-v${{ env.APP_VERSION_NAME }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned release files without removing older releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A HANDOFF
          if git diff --cached --quiet; then
            echo "HANDOFF already contains this release."
            exit 0
          fi
          git commit -m "build: publish signed Android release v${APP_VERSION_NAME} [skip ci]"
          git push origin HEAD:arena/ade03820-lwlwxldodiwjnwmwllxllxmxmxks
