name: Android APK build

on:
  push:
    branches:
      - "arena/01a10cb3-lwlwxldodiwjnwmwllxllxmxmxks"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Load permanent converter signing key
        env:
          WEBAPK_SIGNING_KEYSTORE_B64: ${{ secrets.WEBAPK_SIGNING_KEYSTORE_B64 }}
          WEBAPK_SIGNING_STORE_PASSWORD: ${{ secrets.WEBAPK_SIGNING_STORE_PASSWORD }}
          WEBAPK_SIGNING_KEY_ALIAS: ${{ secrets.WEBAPK_SIGNING_KEY_ALIAS }}
          WEBAPK_SIGNING_KEY_PASSWORD: ${{ secrets.WEBAPK_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WEBAPK_SIGNING_KEYSTORE_B64:-}" ] || [ -z "${WEBAPK_SIGNING_STORE_PASSWORD:-}" ] \
             || [ -z "${WEBAPK_SIGNING_KEY_ALIAS:-}" ] || [ -z "${WEBAPK_SIGNING_KEY_PASSWORD:-}" ]; then
            echo "WEBAPK_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "::warning title=Permanent signing key missing::Build/tests will run, but no converter APK will be published until the Actions signing secrets are configured."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/webapk-studio-release.p12"
          printf '%s' "$WEBAPK_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          {
            echo "WEBAPK_SIGNING_READY=true"
            echo "WEBAPK_SIGNING_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "WEBAPK_SIGNING_STORE_PASSWORD=$WEBAPK_SIGNING_STORE_PASSWORD"
            echo "WEBAPK_SIGNING_KEY_ALIAS=$WEBAPK_SIGNING_KEY_ALIAS"
            echo "WEBAPK_SIGNING_KEY_PASSWORD=$WEBAPK_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK with Android SDK and Gradle
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Smoke test updates, key backup, rotation, and APK signatures
        run: bash scripts/test-runtime-apk.sh "$ANDROID_HOME/build-tools/35.0.0" template/build/outputs/apk/release/template-release-unsigned.apk "$RUNNER_TEMP/webapk-runtime-smoke"

      - name: Package source and verify APK
        if: env.WEBAPK_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WebAPK-Studio.apk
          python3 scripts/create_source_zip.py dist/WebAPK-Studio-source.zip
          APK_BYTES=$(stat -c '%s' dist/WebAPK-Studio.apk)
          echo "APK size: ${APK_BYTES} bytes"
          if [ "$APK_BYTES" -ge 1000000 ]; then
            echo "Web APK Studio exceeds its 1,000,000-byte app-size budget." >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/WebAPK-Studio.apk
          unzip -t dist/WebAPK-Studio.apk >/dev/null
          unzip -t dist/WebAPK-Studio-source.zip >/dev/null

      - name: Save the Actions build on the session branch
        if: env.WEBAPK_SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/WebAPK-Studio.apk dist/WebAPK-Studio-source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Web APK Studio build from Actions [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload APK and source ZIP
        if: env.WEBAPK_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WebAPK-Studio-Android
          path: |
            dist/WebAPK-Studio.apk
            dist/WebAPK-Studio-source.zip
          if-no-files-found: error
          retention-days: 30
