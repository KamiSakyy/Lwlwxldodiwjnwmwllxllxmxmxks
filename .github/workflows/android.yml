name: Android APK build

on:
  push:
    branches:
      - "arena/01a10cb3-lwlwxldodiwjnwmwllxllxmxmxks"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Assemble release APK with Android SDK and Gradle
        shell: bash
        run: |
          set +e
          gradle --no-daemon clean :app:assembleRelease >"$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          tail -n 30 "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            details="$(tail -n 45 "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Gradle build failed::$details"
            exit "$build_status"
          fi

      - name: Smoke test stable signatures, version updates, and rotation
        run: bash scripts/test-runtime-apk.sh "$ANDROID_HOME/build-tools/36.0.0" template/build/outputs/apk/release/template-release-unsigned.apk "$RUNNER_TEMP/webapk-runtime-smoke"

      - name: Package source and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WebAPK-Studio.apk
          python3 scripts/create_source_zip.py dist/WebAPK-Studio-source.zip
          APK_BYTES=$(stat -c '%s' dist/WebAPK-Studio.apk)
          echo "APK size: ${APK_BYTES} bytes"
          if [ "$APK_BYTES" -ge 1000000 ]; then
            echo "Web APK Studio exceeds its 1,000,000-byte app-size budget." >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/WebAPK-Studio.apk
          APP_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/WebAPK-Studio.apk | grep -F "Signer #1 certificate SHA-256 digest" | head -n 1)"
          SITE_CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/webapk-runtime-smoke/runtime-smoke.apk" | grep -F "Signer #1 certificate SHA-256 digest" | head -n 1)"
          if [ "$APP_CERT" != "$SITE_CERT" ]; then
            echo "Converter APK and generated site APK do not share the permanent signing certificate." >&2
            exit 1
          fi
          echo "Converter and generated-site APK use the same permanent signing certificate."
          unzip -t dist/WebAPK-Studio.apk >/dev/null
          unzip -p dist/WebAPK-Studio.apk assets/site-signing-key.p12 | cmp - handoff/WebAPK-Studio-signing.p12
          unzip -t dist/WebAPK-Studio-source.zip >/dev/null

      - name: Save the Actions build on the session branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/WebAPK-Studio.apk dist/WebAPK-Studio-source.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish Web APK Studio build from Actions [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WebAPK-Studio-Android
          path: |
            dist/WebAPK-Studio.apk
            dist/WebAPK-Studio-source.zip
          if-no-files-found: error
          retention-days: 30
