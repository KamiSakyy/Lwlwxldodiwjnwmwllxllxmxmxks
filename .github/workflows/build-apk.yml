name: MailGram — сборка APK

# Сборка только того, что нужно: один job, без проверок и без сторонних запросов.
# Никаких обращений к OAuth-клиентам здесь нет — только компиляция и публикация APK.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAuth client ID (необязательно — переопределяет вшитый в сборку)'
        required: false
        default: ''
      oauth_client_secret:
        description: 'client_secret (необязательно, только для клиента типа Desktop)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mailgram-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Кэш нативной сборки и Gradle (ускорение пересборки)
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build
            .gradle
          key: mailgram-build-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: mailgram-build-${{ runner.os }}-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_PATH"

      - name: Кэш NDK, CMake и платформы
        id: sdk
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-36-ndk-28.2.13676358-cmake-3.22.1-v2

      - name: Установка недостающего (только первый раз)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" | tail -3

      - name: Сборка APK
        env:
          MAILGRAM_OAUTH_CLIENT_ID: ${{ github.event.inputs.oauth_client_id || secrets.OAUTH_CLIENT_ID }}
          MAILGRAM_OAUTH_CLIENT_SECRET: ${{ github.event.inputs.oauth_client_secret || secrets.MAILGRAM_OAUTH_CLIENT_SECRET }}
          STORE_B64: ${{ secrets.MAILGRAM_STORE_B64 }}
        run: |
          if [ -n "$STORE_B64" ]; then
            echo "$STORE_B64" | base64 -d > /tmp/release.keystore
            echo "MAILGRAM_STORE_FILE=/tmp/release.keystore" >> "$GITHUB_ENV"
            echo "MAILGRAM_STORE_PASSWORD=${{ secrets.MAILGRAM_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "MAILGRAM_KEY_ALIAS=${{ secrets.MAILGRAM_KEY_ALIAS }}" >> "$GITHUB_ENV"
          fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee build.log

      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          # Логи раннера недоступны извне, поэтому строки ошибок печатаем как аннотации —
          # они видны через check-runs API сразу после падения.
          if [ -f build.log ]; then
            grep -E "error:|e: |FAILED|What went wrong|Caused by|AAPT|aapt2|Execution failed" build.log \
              | tail -40 | while IFS= read -r line; do
                echo "::error title=Ошибка сборки::$line"
              done
          fi
          exit 0

      - name: Размер APK (лимит 15 МБ)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=Размер APK::$((SIZE / 1024)) КБ"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error title=Размер APK::больше 15 МБ"
            exit 1
          fi

      - name: Проверка подписи APK (apksigner)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          EXPECTED="f5931ac55561e1de79dca0def447753442710e6ae230902f243787646b7aa2a5"
          if grep -qi "$EXPECTED" certs.txt; then
            echo "::notice title=Подпись APK::ключ разработчика подтверждён (SHA-25 совпал)"
          else
            echo "::error title=Подпись APK::отпечаток ключа не совпал с keystore/mailgram-dev.p12"
            exit 1
          fi
          sha256sum "$APK" | awk '{print $1"  app-release.apk"}' > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Диагностика сборки (что упаковщик вырезал)
        if: always()
        run: |
          if [ -f build.log ]; then
            grep -E "R8|Missing class|Warning|warning: |shrink" build.log | head -30 | while IFS= read -r line; do
              echo "::warning title=Упаковщик::$line"
            done
          fi
          M=app/build/outputs/mapping/release
          if [ -d "$M" ]; then
            echo "::warning title=Отчёты::$(( ls $M ) | tr '\n' ' ')"
            if [ -f "$M/resources.txt" ]; then
              echo "::warning title=Вырезанные ресурсы::$(grep -c . "$M/resources.txt") строк"
            fi
          fi
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -n "$AAPT2" ] && [ -f "$APK" ]; then
            "$AAPT2" dump resources "$APK" > res.txt 2>/dev/null || true
            for name in bg_wallpaper_black bg_wallpaper_indigo bg_chat_wallpaper bg_bubble_out bg_bubble_in \
                        bg_send bg_nav_bar bg_search_bar bg_drawer bg_icon_circle_soft bg_context_menu \
                        ic_lock ic_send ic_attach ic_mic ic_emoji ic_menu ic_nav_chats; do
              grep -q "drawable/$name\b" res.txt || echo "::error title=Пропал ресурс::$name"
            done
            echo "::warning title=Ресурсов в APK::$(grep -c '^  resource' res.txt)"
          fi
        continue-on-error: true

      - name: Публикация в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest --title "MailGram — APK (последняя сборка)" \
              --notes "Автоматическая сборка" --prerelease
          gh release edit apk-latest --notes "MailGram $(date -u +%Y-%m-%d)"
          gh release upload apk-latest app/build/outputs/apk/release/app-release.apk --clobber
          gh release upload apk-latest CHECKSUMS.txt --clobber
          echo "::notice title=Готово::https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-latest"

      - name: Папка handoff (APK + исходники, без удаления)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mailgram-ci"
          git config user.email "ci@mailgram.app"
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle | head -1)
          mkdir -p handoff
          cp app/build/outputs/apk/release/app-release.apk handoff/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "handoff/MailGram-$VER-vc$VC.apk"
          git archive --format=zip --prefix=MailGram-source/ -o "handoff/ИСХОДНИК.zip" HEAD
          git add handoff
          if ! git diff --cached --quiet; then
            git commit -m "handoff: APK $VER (vc$VC) + исходники [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: MailGram-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
