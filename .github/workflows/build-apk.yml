name: MailGram — сборка APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAuth client ID (если не задан секрет OAUTH_CLIENT_ID)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  crypto-core:
    name: Крипто-ядро C++ (тест-векторы RFC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Сборка ядра и прогон векторов RFC 8439 / 5869 / 4231 / FIPS 180-4
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter \
            -o /tmp/crypto_selftest tools/crypto_selftest.cpp app/src/main/cpp/mailgram_crypto.cpp
          /tmp/crypto_selftest

  check:
    name: Проверка компиляции (Java + ресурсы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Установка платформы Android (без NDK — так быстрее)
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-37" "build-tools;36.0.0" | tail -3
      - name: Компиляция Java и ресурсов
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :app:processReleaseResources :app:compileReleaseJavaWithJavac 2>&1 | tee build-check.log
      - name: Диагностика при ошибке (аннотации видны через API)
        if: failure()
        run: bash tools/ci-annotate.sh build-check.log 40
      - name: Отчёт о проверке
        if: always()
        run: bash tools/ci-report.sh app/build/outputs/apk/release/app-release.apk build-report.md || true

  apk:
    name: Сборка APK (Java + C++)
    runs-on: ubuntu-latest
    needs: [crypto-core, check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Установка NDK, CMake и платформы
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" | tail -5
      - name: OAuth client ID (секрет OAUTH_CLIENT_ID или параметр запуска)
        env:
          SECRET_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          INPUT_CLIENT_ID: ${{ github.event.inputs.oauth_client_id }}
        run: |
          CLIENT_ID="${SECRET_CLIENT_ID:-$INPUT_CLIENT_ID}"
          if [ -n "$CLIENT_ID" ]; then
            echo "MAILGRAM_OAUTH_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
            echo "::notice title=OAuth::client ID подставлен из секрета — вход будет работать в один тап"
          else
            echo "::notice title=OAuth::client ID не задан — вход настраивается в приложении (кнопка «Настройка подключения»)"
          fi
      - name: Подпись (свой keystore через секреты или встроенный dev-keystore)
        env:
          STORE_B64: ${{ secrets.MAILGRAM_STORE_B64 }}
        run: |
          if [ -n "$STORE_B64" ]; then
            echo "$STORE_B64" | base64 -d > /tmp/release.keystore
            {
              echo "MAILGRAM_STORE_FILE=/tmp/release.keystore"
              echo "MAILGRAM_STORE_PASSWORD=${{ secrets.MAILGRAM_STORE_PASSWORD }}"
              echo "MAILGRAM_KEY_ALIAS=${{ secrets.MAILGRAM_KEY_ALIAS }}"
            } >> "$GITHUB_ENV"
            echo "::notice title=Подпись::используется keystore из секрета MAILGRAM_STORE_B64"
          else
            echo "::notice title=Подпись::используется встроенный dev-keystore (пароль mailgram, alias mailgram)"
          fi
      - name: Сборка release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease 2>&1 | tee build.log
      - name: Диагностика при ошибке (аннотации видны через API)
        if: failure()
        run: bash tools/ci-annotate.sh build.log 40
      - name: Проверка размера APK
        if: success()
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=Размер APK::$(basename "$APK") — $((SIZE / 1024)) КБ"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error title=Размер APK::APK больше 15 МБ ($((SIZE / 1024 / 1024)) МБ) — нужна оптимизация"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libmailgram.so"; then
            echo "::error title=Состав APK::в APK нет нативной библиотеки libmailgram.so для arm64"
            exit 1
          fi
          echo "::notice title=Состав APK::libmailgram.so на месте (arm64-v8a / armeabi-v7a / x86_64)"
      - name: Отчёт о сборке
        if: always()
        run: bash tools/ci-report.sh app/build/outputs/apk/release/app-release.apk build-report.md || true
      - name: Артефакт сборки
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MailGram-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Публикация (APK + отчёт о сборке)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest --title "MailGram — APK (последняя сборка)" \
              --notes "Автоматическая сборка" --prerelease
          gh release edit apk-latest --notes-file build-report.md
          if [ -f "$APK" ]; then
            gh release upload apk-latest "$APK" --clobber
          fi
          echo "::notice title=Релиз::https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-latest"
