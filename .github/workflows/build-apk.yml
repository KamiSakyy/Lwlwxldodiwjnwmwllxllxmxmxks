name: MailGram — сборка APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAuth client ID (если не задан секрет OAUTH_CLIENT_ID)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  crypto-core:
    name: Крипто-ядро C++ (тест-векторы RFC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка ядра и прогон векторов RFC 8439 / 5869 / 4231 / FIPS 180-4
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter \
            -o /tmp/crypto_selftest tools/crypto_selftest.cpp app/src/main/cpp/mailgram_crypto.cpp
          /tmp/crypto_selftest

  check:
    name: Проверка компиляции (Java + ресурсы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: Установка платформы (без NDK — так быстрее)
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-37" "build-tools;36.0.0" | tail -3
      - name: Компиляция Java и ресурсов
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:processReleaseResources :app:compileReleaseJavaWithJavac

  apk:
    name: Сборка APK (Java + C++)
    runs-on: ubuntu-latest
    needs: [crypto-core, check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: Установка NDK, CMake и платформы
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" | tail -5
      - name: Определяем OAuth client ID (секрет или параметр запуска)
        env:
          SECRET_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          INPUT_CLIENT_ID: ${{ github.event.inputs.oauth_client_id }}
        run: |
          CLIENT_ID="${SECRET_CLIENT_ID:-$INPUT_CLIENT_ID}"
          if [ -n "$CLIENT_ID" ]; then
            echo "MAILGRAM_OAUTH_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
            echo "Client ID подставлен из секрета"
          else
            echo "Client ID не задан — вход можно настроить в самом приложении (кнопка «Настройка подключения»)"
          fi
      - name: Сборка release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Данные для Google Cloud Console (нужны и в README)
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== APK ==="
          ls -la "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Размер APK: $((SIZE / 1024)) КБ ($((SIZE / 1024 / 1024)) МБ)"
          echo "=== содержимое (нативные библиотеки и dex) ==="
          unzip -l "$APK" | grep -E "lib/|classes|resources.arsc" || true
          echo "=== SHA-1 подписи (вставить в Google Cloud Console) ==="
          keytool -list -v -storetype PKCS12 -keystore keystore/mailgram-dev.p12 \
            -storepass mailgram 2>/dev/null | grep -E "SHA1:|SHA-1:" || true
          echo "=== redirect URI для Android-клиента ==="
          echo "com.googleusercontent.apps.<ваш-client-id>:/oauth2redirect"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK больше 15 МБ"
            exit 1
          fi
      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: MailGram-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Публикация APK в релизе (постоянная ссылка)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest \
              --title "MailGram — APK (последняя сборка)" \
              --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME}. Скачайте app-release.apk и установите на Android 8.0+." \
              --prerelease
          gh release upload apk-latest "$APK" --clobber
          gh release view apk-latest --json assets --jq '.assets[].name'
