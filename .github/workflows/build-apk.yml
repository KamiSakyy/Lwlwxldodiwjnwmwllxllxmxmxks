name: MailGram — сборка APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      oauth_client_id:
        description: 'OAuth client ID (если не задан секрет OAUTH_CLIENT_ID)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  crypto-core:
    name: Крипто-ядро C++ (тест-векторы RFC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Сборка ядра и прогон векторов RFC 8439 / 5869 / 4231 / FIPS 180-4
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter \
            -o /tmp/crypto_selftest tools/crypto_selftest.cpp app/src/main/cpp/mailgram_crypto.cpp
          /tmp/crypto_selftest

  check:
    name: Проверка компиляции (Java + ресурсы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Установка платформы Android (без NDK — так быстрее)
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-37" "build-tools;36.0.0" | tail -3
      - name: Компиляция Java и ресурсов
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace \
            :app:processReleaseResources :app:compileReleaseJavaWithJavac 2>&1 | tee build-check.log
      - name: Диагностика при ошибке (аннотации видны через API)
        if: failure()
        run: bash tools/ci-annotate.sh build-check.log 40
      - name: Отчёт о проверке
        if: always()
        run: bash tools/ci-report.sh app/build/outputs/apk/release/app-release.apk build-report.md || true

  oauth-check:
    name: Проверка OAuth-клиентов (живой запрос к Google)
    runs-on: ubuntu-latest
    steps:
      - name: Спросить у Google, какие redirect URI принимает каждый клиент
        env:
          DESKTOP_ID: "520212121691-evjpfvomb9k1j5lv9naskcsges4c9mn4.apps.googleusercontent.com"
          ANDROID_ID: "520212121691-pjglb4uc35pk682uej869kr9o82j186f.apps.googleusercontent.com"
        run: |
          set -uo pipefail
          VERIFIER=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9-._~' | head -c 50)
          FAKE_CODE="4/0AVMBsJ$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
          probe () {
            local label="$1" cid="$2" uri="$3"
            local body
            body=$(curl -s -X POST https://oauth2.googleapis.com/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "client_id=$cid" \
              --data-urlencode "code=$FAKE_CODE" \
              --data-urlencode "code_verifier=$VERIFIER" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "redirect_uri=$uri" | tr -d '\r\n')
            local short="${body:0:400}"
            echo "::notice title=OAuth-проба::[$label] $short"
            echo "[$label] $body"
          }
          : > oauth-check.log
          probe "A. Desktop-клиент + локальный порт" "$DESKTOP_ID" "http://127.0.0.1:7717/oauth2redirect" | tee -a oauth-check.log
          probe "B. Desktop-клиент + схема Android" "$DESKTOP_ID" "com.googleusercontent.apps.520212121691-evjpfvomb9k1j5lv9naskcsges4c9mn4:/oauth2redirect" | tee -a oauth-check.log
          probe "C. Android-клиент + схема" "$ANDROID_ID" "com.googleusercontent.apps.520212121691-pjglb4uc35pk682uej869kr9o82j186f:/oauth2redirect" | tee -a oauth-check.log
          probe "D. Android-клиент + локальный порт" "$ANDROID_ID" "http://127.0.0.1:7717/oauth2redirect" | tee -a oauth-check.log

      - name: Проверить саму страницу авторизации (тот же запрос, что делает приложение)
        env:
          ANDROID_ID: "520212121691-pjglb4uc35pk682uej869kr9o82j186f.apps.googleusercontent.com"
        run: |
          set -uo pipefail
          VERIFIER=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9-._~' | head -c 50)
          CHALLENGE=$(printf '%s' "$VERIFIER" | sha256sum | cut -d' ' -f1 | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          html=$(curl -s -G https://accounts.google.com/o/oauth2/v2/auth \
            --data-urlencode "client_id=$ANDROID_ID" \
            --data-urlencode "redirect_uri=com.googleusercontent.apps.520212121691-pjglb4uc35pk682uej869kr9o82j186f:/oauth2redirect" \
            --data-urlencode "response_type=code" \
            --data-urlencode "scope=openid email https://www.googleapis.com/auth/gmail.modify" \
            --data-urlencode "code_challenge=$CHALLENGE" \
            --data-urlencode "code_challenge_method=S256" \
            --data-urlencode "state=mailgramprobe" \
            --data-urlencode "access_type=offline" \
            --data-urlencode "prompt=consent" \
            --data-urlencode "hl=ru" | tr -d '\r\n')
          marker=""
          for m in invalid_request invalid_client redirect_uri_mismatch unauthorized_client access_denied "Custom URI scheme"; do
            if printf '%s' "$html" | grep -qi "$m"; then marker="$marker | $m"; fi
          done
          if [ -n "$marker" ]; then
            echo "::error title=Страница авторизации::Google отвечает ошибкой:$marker"
          else
            echo "::notice title=Страница авторизации::ошибок нет — Google готов показать выбор аккаунта (страница $(printf '%s' "$html" | wc -c) байт)"
          fi

  apk:
    name: Сборка APK (Java + C++)
    runs-on: ubuntu-latest
    needs: [crypto-core, check]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Установка NDK, CMake и платформы
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" | tail -5
      - name: OAuth client ID (секрет OAUTH_CLIENT_ID или параметр запуска)
        env:
          SECRET_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          INPUT_CLIENT_ID: ${{ github.event.inputs.oauth_client_id }}
        run: |
          CLIENT_ID="${SECRET_CLIENT_ID:-$INPUT_CLIENT_ID}"
          if [ -z "$CLIENT_ID" ]; then
            # Значение по умолчанию живёт в app/build.gradle — здесь повторяем его,
            # чтобы отчёт о сборке показывал реальный client ID.
            CLIENT_ID="520212121691-pjglb4uc35pk682uej869kr9o82j186f.apps.googleusercontent.com"
            echo "::notice title=OAuth::используется client ID, вшитый в проект — вход работает в один тап"
          else
            echo "::notice title=OAuth::client ID задан секретом/параметром — вход работает в один тап"
          fi
          echo "MAILGRAM_OAUTH_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_ENV"
      - name: Подпись (свой keystore через секреты или встроенный dev-keystore)
        env:
          STORE_B64: ${{ secrets.MAILGRAM_STORE_B64 }}
        run: |
          if [ -n "$STORE_B64" ]; then
            echo "$STORE_B64" | base64 -d > /tmp/release.keystore
            {
              echo "MAILGRAM_STORE_FILE=/tmp/release.keystore"
              echo "MAILGRAM_STORE_PASSWORD=${{ secrets.MAILGRAM_STORE_PASSWORD }}"
              echo "MAILGRAM_KEY_ALIAS=${{ secrets.MAILGRAM_KEY_ALIAS }}"
            } >> "$GITHUB_ENV"
            echo "::notice title=Подпись::используется keystore из секрета MAILGRAM_STORE_B64"
          else
            echo "::notice title=Подпись::используется встроенный dev-keystore (пароль mailgram, alias mailgram)"
          fi
      - name: Сборка release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease 2>&1 | tee build.log
      - name: Диагностика при ошибке (аннотации видны через API)
        if: failure()
        run: bash tools/ci-annotate.sh build.log 40
      - name: Проверка размера APK
        if: success()
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "::notice title=Размер APK::$(basename "$APK") — $((SIZE / 1024)) КБ"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error title=Размер APK::APK больше 15 МБ ($((SIZE / 1024 / 1024)) МБ) — нужна оптимизация"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libmailgram.so"; then
            echo "::error title=Состав APK::в APK нет нативной библиотеки libmailgram.so для arm64"
            exit 1
          fi
          echo "::notice title=Состав APK::libmailgram.so на месте (arm64-v8a / armeabi-v7a / x86_64)"
      - name: Проверка, что OAuth-схема вшита в манифест
        if: success()
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SCHEME="${MAILGRAM_OAUTH_CLIENT_ID%.apps.googleusercontent.com}"
          if aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -qi "com.googleusercontent.apps.${SCHEME}"; then
            echo "::notice title=OAuth::схема редиректа в манифесте совпадает с client ID — вход сработает в один тап"
          else
            echo "::error title=OAuth::в манифесте нет схемы com.googleusercontent.apps.${SCHEME} — Google отклонит вход"
            exit 1
          fi
      - name: Отчёт о сборке
        if: always()
        run: bash tools/ci-report.sh app/build/outputs/apk/release/app-release.apk build-report.md || true
      - name: Артефакт сборки
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: MailGram-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Публикация (APK + отчёт о сборке)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          gh release view apk-latest > /dev/null 2>&1 || \
            gh release create apk-latest --title "MailGram — APK (последняя сборка)" \
              --notes "Автоматическая сборка" --prerelease
          gh release edit apk-latest --notes-file build-report.md
          if [ -f "$APK" ]; then
            gh release upload apk-latest "$APK" --clobber
          fi
          echo "::notice title=Релиз::https://github.com/${GITHUB_REPOSITORY}/releases/tag/apk-latest"
