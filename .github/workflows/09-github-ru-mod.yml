name: 09 GitHub RU MOD (сборка APK)

# Пересборка мода GitHub-RU из официального APK:
#   база (XAPK с APKPure) -> apktool d -> tools/mod_github_ru.py -> apktool b
#   -> tools/repack_apk.py (вес/выравнивание/лицензии) -> apksigner -> tools/check_apk.py
# Скрипты настроены под base 1.279.0 (vc 950): имена smali-файлов обфусцированы,
# для другой версии их нужно перепроверить.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/09-github-ru-mod.yml'
      - 'tools/mod_github_ru.py'
      - 'tools/repack_apk.py'
      - 'tools/check_apk.py'
      - 'tools/i18n/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APKNAME: GitHub-1.279.0-mod.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: apksigner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner unzip

      - name: apktool 2.9.3
        run: curl -fsSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: База — официальный APK и сплиты
        run: |
          set -e
          mkdir -p /tmp/base
          curl -fsSL -o /tmp/base/base.xapk 'https://d.apkpure.net/b/XAPK/com.github.android?version=latest'
          cd /tmp/base
          unzip -o -q base.xapk
          for f in com.github.android.apk config.mdpi.apk config.arm64_v8a.apk; do
            if [ -f "$f" ]; then echo "$f: $(stat -c%s "$f") байт"; fi
          done

      - name: Декод базы и сплитов
        run: |
          set -e
          mkdir -p /tmp/work/split_dec
          java -Xmx4g -jar /tmp/apktool.jar d -f -o /tmp/work/dec /tmp/base/com.github.android.apk
          for f in /tmp/base/config.*.apk; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            java -Xmx4g -jar /tmp/apktool.jar d -f -o "/tmp/work/split_dec/$n" "$f"
          done

      - name: Мод
        run: python3 tools/mod_github_ru.py /tmp/work/dec --ru-dir tools/i18n/ru --splits /tmp/work/split_dec

      - name: Сборка apktool
        run: java -Xmx6g -jar /tmp/apktool.jar b /tmp/work/dec -f -o /tmp/work/mod.apk

      - name: Перепаковка (вес, выравнивание, лицензии)
        run: python3 tools/repack_apk.py /tmp/work/mod.apk /tmp/work/mod-aligned.apk --meta-from /tmp/base/com.github.android.apk

      - name: Подпись
        run: |
          set -e
          mkdir -p handoff
          apksigner sign \
            --ks handoff/keys/github-ru.jks --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias github-ru --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "handoff/$APKNAME" /tmp/work/mod-aligned.apk
          apksigner verify --verbose "handoff/$APKNAME" | head -12

      - name: Контроль APK
        run: python3 tools/check_apk.py "handoff/$APKNAME" /tmp/base/com.github.android.apk

      - name: Публикация в handoff/
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "handoff/$APKNAME" handoff/REPORT-MOD.md
          if git diff --cached --quiet; then
            echo "изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "github-ru mod: $APKNAME ($(stat -c%s "handoff/$APKNAME") байт) [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Итог
        run: |
          echo "### GitHub RU MOD" >> "$GITHUB_STEP_SUMMARY"
          echo "- файл: \`handoff/$APKNAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- размер: $(stat -c%s "handoff/$APKNAME") байт" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: $(sha256sum "handoff/$APKNAME" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
