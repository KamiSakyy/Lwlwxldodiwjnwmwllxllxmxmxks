name: MailGram — JVM-прогон экранов

# Открывает все экраны приложения на чистой JVM (Robolectric) — без эмулятора.
# Любая пойманная ошибка попадает в аннотации с точным стеком.
# Сборку и публикацию APK эта задача не трогает (см. build-apk.yml).

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailgram-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: JVM-прогон
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Кэш платформы
        id: sdk
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-36-jvm-v1

      - name: Установка платформы (только первый раз)
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-36" "build-tools;36.0.0" | tail -2

      - name: JVM-прогон экранов
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee smoke.log

      - name: Ошибки экранов — в аннотации
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            [ -e "$f" ] || continue
            python3 - "$f" <<'PY'
import sys, xml.etree.ElementTree as ET
t = ET.parse(sys.argv[1]); r = t.getroot()
for tc in r.iter('testcase'):
    for fail in list(tc.iter('failure')) + list(tc.iter('error')):
        msg = (fail.get('message') or fail.text or '')[:1000]
        msg = ' '.join(msg.split())
        print(f"::error title=Падение: {tc.get('name')}::{msg}")
PY
          done
          if [ -f smoke.log ] && grep -q "What went wrong" smoke.log; then
            grep -A 20 "What went wrong" smoke.log | head -40 | while IFS= read -r line; do
              echo "::error title=Сборка/тесты::$line"
            done
          fi
          exit 0
