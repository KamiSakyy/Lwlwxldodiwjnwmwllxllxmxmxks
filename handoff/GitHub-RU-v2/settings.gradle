pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = "GitHub-RU"

// Рабочий модуль — :studio (собирается всегда: Gradle + Android SDK, ноль зависимостей).
include ':studio'

// Полный клиент (:app, 43 тыс. файлов декомпиляции jadx) живёт в ветке
// arena/8b3246a5-lwlwxldodiwjnwmwllxllxmxmxks (handoff/GitHub-RU-v2/app).
// Он подключается автоматически, как только исходники окажутся на месте,
// чтобы не тащить 200 МБ в каждую ветку и не ломать сборку :studio.
if (file('app/src/main/java').isDirectory()) {
    include ':app'
}
