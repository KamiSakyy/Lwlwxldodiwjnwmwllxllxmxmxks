# --- Память и скорость сборки (CI правит -Xmx под раннер) ---
# Здесь только проверенные флаги: сборка :studio обязана оставаться зелёной
# на AGP 9.4 / Gradle 9.6, поэтому устаревшие android.* не добавляем.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android: современные API (28–36), без AndroidX-зависимостей (их попросту нет).
android.useAndroidX=true
android.nonTransitiveRClass=true
