plugins {
    id "com.android.application"
}

def quotedBuildField = { String value ->
    def escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${escaped}\""
}

def firebaseApiKey = (project.findProperty("firebaseApiKey") ?: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA").toString()
def databaseUrl = (project.findProperty("databaseUrl") ?: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app").toString()
def turnUrl = (project.findProperty("turnUrl") ?: "").toString()
def turnUsername = (project.findProperty("turnUsername") ?: "").toString()
def turnCredential = (project.findProperty("turnCredential") ?: "").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "4").toString().toInteger()
def appVersionName = (project.findProperty("appVersionName") ?: "1.0.4").toString()
def releaseStorePath = System.getenv("RELEASE_KEYSTORE_PATH")
def releasePasswordFile = rootProject.file("HANDOFF/nox-release-key-password.txt")
def localReleasePassword = releasePasswordFile.exists() ? releasePasswordFile.getText("UTF-8").trim() : ""
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: localReleasePassword
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: "nox-release"
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: releaseStorePassword

android {
    namespace "com.kamisakyy.noxchat"
    compileSdk 36

    defaultConfig {
        applicationId "com.kamisakyy.noxchat"
        minSdk 26
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters "arm64-v8a"
        }

        buildConfigField "String", "FIREBASE_API_KEY", quotedBuildField(firebaseApiKey)
        buildConfigField "String", "FIREBASE_DATABASE_URL", quotedBuildField(databaseUrl)
        buildConfigField "String", "TURN_URL", quotedBuildField(turnUrl)
        buildConfigField "String", "TURN_USERNAME", quotedBuildField(turnUsername)
        buildConfigField "String", "TURN_CREDENTIAL", quotedBuildField(turnCredential)
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            excludes += ["**/libsignal_jni_testing.so"]
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*",
                         "libsignal_jni*.dylib", "signal_jni*.dll", "libsignal_jni_testing.so",
                         "**/*.so", "**/*.so.*"]
        }
    }

    signingConfigs {
        release {
            storeFile file(releaseStorePath ?: "${rootDir}/HANDOFF/nox-release-key.p12")
            storeType "PKCS12"
            storePassword releaseStorePassword ?: ""
            keyAlias releaseKeyAlias ?: "nox-release"
            keyPassword releaseKeyPassword ?: (releaseStorePassword ?: "")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.core:core:1.16.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.github.webrtc-sdk:android:125.6422.07"
    implementation "org.signal:libsignal-android:0.105.0"
    implementation "org.signal:libsignal-client:0.105.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    testImplementation "junit:junit:4.13.2"
}
