plugins {
    id 'com.android.application'
}

// OAuth-клиенты. Проверено живыми запросами к Google из CI (job «Проверка OAuth-клиентов»):
//
//  * Android-клиент + схема com.googleusercontent.apps.<id>:/oauth2redirect — основной путь.
//    Работает, когда у клиента включён «Advanced Settings → Enable custom URI scheme»
//    (Google выключает схему у новых Android-клиентов по умолчанию; без галочки страница
//    входа отвечает «Error 400: invalid_request»);
//  * Desktop-клиент + redirect http://127.0.0.1:7717/oauth2redirect — резервный путь.
//    Страницу входа Google принимает, но при обмене кода требует client_secret
//    («client_secret is missing»), поэтому для него нужен секрет: он приходит при сборке из
//    секрета репозитория MAILGRAM_OAUTH_CLIENT_SECRET (или -Pmailgram.oauthClientSecret=...)
//    либо вводится в приложении на экране «Настройка подключения». В репозитории секрет не хранится.
//
// Какой путь использовать, приложение решает само по живому ответу Google (Auth.probeNow).
def defaultAndroidClientId = '520212121691-pjglb4uc35pk682uej869kr9o82j186f.apps.googleusercontent.com'
def defaultDesktopClientId = '520212121691-evjpfvomb9k1j5lv9naskcsges4c9mn4.apps.googleusercontent.com'
def androidClientId = (project.findProperty('mailgram.androidClientId')
        ?: System.getenv('MAILGRAM_ANDROID_CLIENT_ID') ?: defaultAndroidClientId).toString().trim()
def desktopClientId = (project.findProperty('mailgram.desktopClientId')
        ?: System.getenv('MAILGRAM_DESKTOP_CLIENT_ID') ?: defaultDesktopClientId).toString().trim()
// Основной клиент: по умолчанию Android (его схема прописывается в манифест).
// Можно переопределить, передав client ID в MAILGRAM_OAUTH_CLIENT_ID.
def oauthClientId = (project.findProperty('mailgram.oauthClientId')
        ?: System.getenv('MAILGRAM_OAUTH_CLIENT_ID') ?: androidClientId).toString().trim()
def altClientId = (project.findProperty('mailgram.altClientId')
        ?: System.getenv('MAILGRAM_ALT_CLIENT_ID') ?: desktopClientId).toString().trim()
def oauthClientSecret = (project.findProperty('mailgram.oauthClientSecret')
        ?: System.getenv('MAILGRAM_OAUTH_CLIENT_SECRET') ?: '').toString().trim()
def googleSuffix = '.apps.googleusercontent.com'
def schemeOf = { id -> id.endsWith(googleSuffix)
        ? 'com.googleusercontent.apps.' + id.substring(0, id.length() - googleSuffix.length())
        : 'com.mailgram.app' }
def redirectScheme = androidClientId.isEmpty() ? 'com.mailgram.app' : schemeOf(androidClientId)
// Режим по умолчанию: если вшитый client ID — тот же Android-клиент, то схема, иначе локальный порт.
def defaultAuthMode = oauthClientId.equals(androidClientId) ? 'android' : 'loopback'

// Подпись: свои значения можно передать через секреты/параметры сборки.
def storeFilePath = (project.findProperty('mailgram.storeFile')
        ?: System.getenv('MAILGRAM_STORE_FILE') ?: 'keystore/mailgram-dev.p12').toString()
def storePasswordValue = (project.findProperty('mailgram.storePassword')
        ?: System.getenv('MAILGRAM_STORE_PASSWORD') ?: 'mailgram').toString()
def keyAliasValue = (project.findProperty('mailgram.keyAlias')
        ?: System.getenv('MAILGRAM_KEY_ALIAS') ?: 'mailgram').toString()

android {
    namespace 'com.mailgram.app'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.mailgram.app'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '3.6.2'

        manifestPlaceholders.put('appAuthRedirectScheme', redirectScheme)
        buildConfigField 'String', 'OAUTH_CLIENT_ID', '"' + oauthClientId + '"'
        buildConfigField 'String', 'OAUTH_ANDROID_CLIENT_ID', '"' + androidClientId + '"'
        buildConfigField 'String', 'OAUTH_ALT_CLIENT_ID', '"' + altClientId + '"'
        buildConfigField 'String', 'OAUTH_HAS_SECRET', '"' + (oauthClientSecret.isEmpty() ? "" : "1") + '"'
        buildConfigField 'String', 'OAUTH_REDIRECT_SCHEME', '"' + redirectScheme + '"'
        buildConfigField 'String', 'OAUTH_DEFAULT_MODE', '"' + defaultAuthMode + '"'
        buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '"' + oauthClientSecret + '"'

        externalNativeBuild {
            cmake {
                // статический C++ — без лишней libc++_shared.so в APK
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(storeFilePath)
            storePassword storePasswordValue
            keyAlias keyAliasValue
            keyPassword storePasswordValue
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.browser:browser:1.8.0'
}
