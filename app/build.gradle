plugins {
    id 'com.android.application'
}

// OAuth client ID публичного клиента не является секретом (он виден в любом APK и в
// запросах к Google). Значения по умолчанию вшиты в сборку, чтобы вход работал сразу
// после установки.
//
// Основной клиент — Android: вход через схему com.googleusercontent.apps.<id>:/oauth2redirect,
// без client_secret. ВАЖНО: у Android-клиента в консоли Google должен быть включён
// «Advanced Settings → Enable custom URI scheme» — по умолчанию Google его выключает и
// возвращает «Error 400: invalid_request». Проверено живым запросом к Google (CI job
// «Проверка OAuth-клиентов»): клиент из этой сборки схему принимает.
//
// Резервный путь — клиент типа Desktop: вход через локальный порт 127.0.0.1:7717.
// Ему Google требует client_secret даже с PKCE («client_secret is missing»), поэтому секрет
// передаётся только на этапе сборки через секрет репозитория MAILGRAM_OAUTH_CLIENT_SECRET
// (или -Pmailgram.oauthClientSecret) и в исходниках не хранится.
def defaultOauthClientId = '520212121691-pjglb4uc35pk682uej869kr9o82j186f.apps.googleusercontent.com'
def defaultAltClientId = '520212121691-evjpfvomb9k1j5lv9naskcsges4c9mn4.apps.googleusercontent.com'
def oauthClientId = (project.findProperty('mailgram.oauthClientId')
        ?: System.getenv('MAILGRAM_OAUTH_CLIENT_ID') ?: defaultOauthClientId).toString().trim()
def androidClientId = (project.findProperty('mailgram.androidClientId')
        ?: System.getenv('MAILGRAM_ANDROID_CLIENT_ID') ?: oauthClientId).toString().trim()
def altClientId = (project.findProperty('mailgram.altClientId')
        ?: System.getenv('MAILGRAM_ALT_CLIENT_ID') ?: defaultAltClientId).toString().trim()
def oauthClientSecret = (project.findProperty('mailgram.oauthClientSecret')
        ?: System.getenv('MAILGRAM_OAUTH_CLIENT_SECRET') ?: '').toString().trim()
def googleSuffix = '.apps.googleusercontent.com'
def schemeOf = { id -> id.endsWith(googleSuffix)
        ? 'com.googleusercontent.apps.' + id.substring(0, id.length() - googleSuffix.length())
        : 'com.mailgram.app' }
def redirectScheme = androidClientId.isEmpty() ? 'com.mailgram.app' : schemeOf(androidClientId)
// Режим по умолчанию: если вшитый client ID — тот же Android-клиент, то схема, иначе локальный порт.
def defaultAuthMode = oauthClientId.equals(androidClientId) ? 'android' : 'loopback'

// Подпись: свои значения можно передать через секреты/параметры сборки.
def storeFilePath = (project.findProperty('mailgram.storeFile')
        ?: System.getenv('MAILGRAM_STORE_FILE') ?: 'keystore/mailgram-dev.p12').toString()
def storePasswordValue = (project.findProperty('mailgram.storePassword')
        ?: System.getenv('MAILGRAM_STORE_PASSWORD') ?: 'mailgram').toString()
def keyAliasValue = (project.findProperty('mailgram.keyAlias')
        ?: System.getenv('MAILGRAM_KEY_ALIAS') ?: 'mailgram').toString()

android {
    namespace 'com.mailgram.app'
    compileSdk 37
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.mailgram.app'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0.0'

        manifestPlaceholders.put('appAuthRedirectScheme', redirectScheme)
        buildConfigField 'String', 'OAUTH_CLIENT_ID', '"' + oauthClientId + '"'
        buildConfigField 'String', 'OAUTH_ANDROID_CLIENT_ID', '"' + androidClientId + '"'
        buildConfigField 'String', 'OAUTH_ALT_CLIENT_ID', '"' + altClientId + '"'
        buildConfigField 'String', 'OAUTH_REDIRECT_SCHEME', '"' + redirectScheme + '"'
        buildConfigField 'String', 'OAUTH_DEFAULT_MODE', '"' + defaultAuthMode + '"'
        buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '"' + oauthClientSecret + '"'

        externalNativeBuild {
            cmake {
                // статический C++ — без лишней libc++_shared.so в APK
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file(storeFilePath)
            storePassword storePasswordValue
            keyAlias keyAliasValue
            keyPassword storePasswordValue
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/*.version', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.browser:browser:1.10.0'
}
