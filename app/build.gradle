plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingPropertiesFile = rootProject.file('handoff/signing.properties')
def signingProperties = new Properties()
if (!signingPropertiesFile.isFile()) {
    throw new GradleException('Missing handoff/signing.properties and permanent APK signing key')
}
signingPropertiesFile.withInputStream { signingProperties.load(it) }
def signingStoreFile = rootProject.file(signingProperties.getProperty('storeFile'))
def signingStorePassword = signingProperties.getProperty('storePassword')
def signingKeyAlias = signingProperties.getProperty('keyAlias')
def signingKeyPassword = signingProperties.getProperty('keyPassword')
if (!signingStoreFile.isFile() || !signingStorePassword || !signingKeyAlias || !signingKeyPassword) {
    throw new GradleException('Invalid permanent APK signing key in handoff/')
}
def actionsRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def converterVersionCode = actionsRunNumber == null ? 1 : 1000 + actionsRunNumber.toInteger()
def converterVersionName = actionsRunNumber == null ? '1.0' : "1.0.${actionsRunNumber}"

android {
    namespace 'ru.webapk.studio'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'ru.webapk.studio'
        minSdk 22
        targetSdk 36
        versionCode converterVersionCode
        versionName converterVersionName
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags '-std=c++17'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        permanentRelease {
            storeFile signingStoreFile
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
            storeType signingProperties.getProperty('storeType', 'PKCS12')
        }
    }

    buildTypes {
        release {
            // The same ordinary handoff key signs every converter build so updates install in place.
            signingConfig signingConfigs.permanentRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main {
            assets.srcDir(layout.buildDirectory.dir('generated/template-assets'))
            java.srcDir(rootProject.file('shared/src/main/java'))
        }
    }

    packaging {
        jniLibs {
            // The converter UI does not use Compose's optional native PathIterator backend.
            excludes += ['**/libandroidx.graphics.path.so']
        }
    }
}

def embeddedTemplateDir = layout.buildDirectory.dir('generated/template-assets')

tasks.register('buildPythonRuntimeTemplate', GradleBuild) {
    dir = rootProject.file('pythonTemplate')
    tasks = ['assembleRelease']
}

tasks.register('prepareEmbeddedTemplate', Copy) {
    dependsOn(':template:assembleRelease', tasks.named('buildPythonRuntimeTemplate'))
    from(project(':template').layout.buildDirectory.file('outputs/apk/release/template-release-unsigned.apk')) {
        rename { 'host-template.apk' }
    }
    from(rootProject.file('pythonTemplate/build/outputs/apk/release')) {
        include '*.apk'
        rename { 'python-host-template.apk' }
    }
    from(signingStoreFile) {
        rename { 'site-signing-key.p12' }
    }
    into(embeddedTemplateDir)
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareEmbeddedTemplate'))
}

dependencies {
    // Keep API 22 support: Activity 1.12+ and Compose Foundation 1.10+ raise minSdk to 23.
    implementation 'androidx.activity:activity-compose:1.11.0'
    // Core 1.17 matches compileSdk 36; 1.18+ requires API 36.1 and 1.19+ requires compileSdk 37.
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.compose.runtime:runtime:1.9.0'
    implementation 'androidx.compose.runtime:runtime-saveable:1.9.0'
    implementation 'androidx.compose.foundation:foundation:1.8.1'
    implementation 'androidx.compose.foundation:foundation-layout:1.8.1'
    implementation 'androidx.compose.ui:ui:1.8.2'
    implementation 'androidx.compose.ui:ui-text:1.8.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.8.2'
    implementation 'androidx.compose.material:material-ripple:1.8.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
}
