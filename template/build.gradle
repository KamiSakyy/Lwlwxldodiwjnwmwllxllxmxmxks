plugins {
    id 'com.android.application'
}

android {
    namespace 'com.webapk.hosttemplate'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.webapk.hosttemplate'
        minSdk 22
        targetSdk 36
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDir(rootProject.file('shared/src/main/java'))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
